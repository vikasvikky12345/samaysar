spring.application.name=clinicq
server.port=${PORT:8085}
# Local secrets (git-ignored); real env vars still take precedence
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinicq}
spring.datasource.username=${DB_USER:clinicq}
spring.datasource.password=${DB_PASSWORD:clinicq}

# Flyway owns the schema; Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health
