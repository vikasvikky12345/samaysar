name: clinicq

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clinicq
      POSTGRES_USER: clinicq
      POSTGRES_PASSWORD: clinicq
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicq"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/clinicq
      DB_USER: clinicq
      DB_PASSWORD: clinicq
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:8085"

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
